<!doctype html>
<html><head><meta charset="utf-8"><title>PureTV social card</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url(../../app/ui/demo/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { font-family: "Inter", system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased;
  background: radial-gradient(700px 420px at 86% 30%, rgba(196,140,190,.32), transparent 70%),
              radial-gradient(600px 400px at 70% 110%, rgba(90,120,220,.28), transparent 70%), #08090d; }
/* everything important stays 40pt inside the edge, as GitHub's template asks */
.safe { position: absolute; inset: 40px; }
.left { position: absolute; left: 40px; top: 72px; width: 470px; }
.tag { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 99px; font-size: 17px; font-weight: 600;
  background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); color: rgba(255,255,255,.85); }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 10px #30d158; }
h1 { font-size: 108px; font-weight: 800; letter-spacing: -5px; line-height: 1; margin: 26px 0 16px;
  background: linear-gradient(180deg, #ffffff 30%, #c9cbd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 29px; font-weight: 500; line-height: 1.32; letter-spacing: -.4px; color: rgba(255,255,255,.82); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.chip { padding: 10px 16px; border-radius: 14px; font-size: 17px; font-weight: 600; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.chip b { color: #30d158; margin-right: 6px; }
.foot { position: absolute; left: 40px; bottom: 44px; font-size: 16px; color: rgba(255,255,255,.55); }
.foot strong { color: rgba(255,255,255,.88); font-weight: 600; }
.heart { width: 15px; height: 14px; vertical-align: -2px; margin: 0 2px; }
/* the TV */
.tv { position: absolute; right: 40px; top: 84px; width: 680px; }
.screen { width: 680px; height: 383px; border-radius: 16px; padding: 9px; background: #060608;
  box-shadow: 0 0 0 1px #2a2b31, 0 50px 90px rgba(0,0,0,.6), 0 0 120px rgba(160,130,200,.18); }
.screen img { display: block; width: 100%; height: 100%; border-radius: 9px; object-fit: cover; }
.stand { width: 210px; height: 24px; margin: 0 auto; background: linear-gradient(#18191d, #0c0c0f); clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); }
.glow { width: 520px; height: 26px; margin: 2px auto 0; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.6), transparent 70%); }
.url { position: absolute; right: 40px; bottom: 44px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,.7); }
</style></head>
<body>
  <div class="left">
    <div class="tag"><i></i>For Android TV &amp; Google TV</div>
    <h1>PureTV</h1>
    <p class="sub">Clean your TV, remove the ads, and give it a beautiful tvOS‑inspired home.</p>
    <div class="chips"><span class="chip"><b>✓</b>Backed up first</span><span class="chip"><b>✓</b>Nothing deleted</span><span class="chip"><b>✓</b>One‑click restore</span></div>
  </div>
  <div class="tv"><div class="screen"><img src="../shots/home.png" alt=""></div><div class="stand"></div><div class="glow"></div></div>
  <div class="foot">Made with <svg class="heart" viewBox="0 0 24 22"><path fill="#ff375f" d="M12 21.5 10.3 20C4.2 14.5 0 10.7 0 6.1 0 2.6 2.7 0 6.1 0 8.1 0 10 .9 12 2.6 14 .9 15.9 0 17.9 0 21.3 0 24 2.6 24 6.1c0 4.6-4.2 8.4-10.3 13.9z"/></svg> by <strong>Crazified Studios</strong></div>
  <div class="url">github.com/advik-srivastava/puretv</div>
</body></html>
