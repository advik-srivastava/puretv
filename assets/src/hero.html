<!doctype html>
<html><head><meta charset="utf-8"><title>PureTV README banner</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url(../../app/ui/demo/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1600px; height: 900px; overflow: hidden; }
body { font-family: "Inter", system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; text-align: center; padding-top: 70px;
  background: radial-gradient(1000px 520px at 50% 108%, rgba(120,150,235,.30), transparent 70%),
              radial-gradient(700px 420px at 85% 0%, rgba(214,150,190,.20), transparent 70%), #07080b; }
.tag { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 99px; font-size: 19px; font-weight: 600;
  background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); color: rgba(255,255,255,.85); }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 10px #30d158; }
h1 { font-size: 104px; font-weight: 800; letter-spacing: -5px; line-height: 1; margin: 22px 0 14px;
  background: linear-gradient(180deg, #fff 35%, #c3c6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 29px; font-weight: 500; letter-spacing: -.4px; color: rgba(255,255,255,.75); }
.tv { width: 1080px; margin: 46px auto 0; border-radius: 18px; padding: 9px; background: #050507;
  box-shadow: 0 0 0 1px #2a2b31, 0 40px 90px rgba(0,0,0,.65), 0 0 160px rgba(140,150,230,.25); }
.tv img { display: block; width: 100%; border-radius: 10px; }
</style></head>
<body>
  <div class="tag"><i></i>For Android TV &amp; Google TV</div>
  <h1>PureTV</h1>
  <div class="sub">A calm, beautiful Home screen. No ads, no clutter.</div>
  <div class="tv"><img src="../shots/home.png" alt=""></div>
</body></html>
