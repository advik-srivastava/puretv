<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureTV 3 native demo</title>
<!-- A browser stand-in for the native Android Home screen (launcher/src/tv/pure/home): same assets, layout
     numbers, glass method (a slice of the pre-blurred wallpaper, never a live blur), focus, sounds and screens. -->
<style>
@font-face { font-family: "Antonio"; font-weight: 300; src: url(demo/fonts/antonio-latin-300.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url(demo/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
:root { --ease: cubic-bezier(.2,.8,.2,1); --lift: cubic-bezier(.25,1.35,.4,1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0b0e; color: #fff; overflow: hidden; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; overflow: hidden; background: #000; transform-origin: center; border-radius: 6px; }
#help { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; color: #ffffff70; }
#help b { color: #ffffffb0; }

.scene { position: absolute; inset: 0; opacity: 0; transition: opacity 2.4s var(--ease); }
.scene.on { opacity: 1; }
.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gclock { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "Antonio"; font-weight: 300; line-height: 1; letter-spacing: .01em; }
.gclock span { position: absolute; left: 0; right: 0; top: 0; }
.gclock .fill { color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 1920px 1080px; filter: brightness(1.3) saturate(1.15); opacity: .92; }
.gclock .rim { color: rgba(255,255,255,.5); -webkit-text-stroke: 2.5px rgba(255,255,255,.9); text-shadow: 0 4px 26px rgba(0,26,45,.5); }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .45s var(--ease); pointer-events: none; }
#date { position: absolute; left: 0; right: 0; text-align: center; transition: top .9s var(--ease), opacity .3s; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
#date .g { font: 600 22px "Inter"; color: rgba(255,255,255,.85); }
#date .d { font: 600 34px "Inter"; margin-top: 8px; }

.glass { position: absolute; background-repeat: no-repeat; background-size: 1920px 1080px; overflow: visible; }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: var(--sheen), var(--tint); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3), inset 0 1.5px 0 rgba(255,255,255,.55); }
#stage.g-liquid { --tint: rgba(24,24,32,.22); --sheen: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.06)); }
#stage.g-frosted { --tint: rgba(70,72,84,.38); --sheen: linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.18)); }
#stage.g-dark { --tint: rgba(14,14,18,.8); --sheen: linear-gradient(0deg, transparent, transparent); }

#content { position: absolute; inset: 0; transition: transform .56s var(--ease), opacity .9s var(--ease); }
#content.ambient { transform: translateY(var(--amb)); opacity: 0; }
#band { border-radius: 46px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.row { position: absolute; display: flex; gap: 36px; }
.tile { position: relative; flex: none; transition: transform .38s var(--lift); }
.tile .face { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: box-shadow .38s var(--ease); }
.tile .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile .face .gloss { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 60%); opacity: 0; transition: opacity .3s; }
.tile .name { position: absolute; left: -40px; right: -40px; text-align: center; font: 600 22px "Inter"; opacity: 0; transition: opacity .25s; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.tile.focus { transform: scale(1.12); z-index: 2; }
.tile.focus .face { box-shadow: 0 24px 48px rgba(0,0,0,.45); }
.tile.focus .face .gloss, .tile.focus .name { opacity: 1; }
.tile.held .face { outline: 4px solid #fff; outline-offset: -4px; }
.tile .kb { position: absolute; right: 10px; bottom: 9px; padding: 3px 13px; border-radius: 99px; background: #ffd60a; color: #1a1400; font: 600 15px "Inter"; }
.sysface { display: grid; place-items: center; width: 100%; height: 100%; }
.sysface svg { width: 50%; height: 50%; }

#bar { position: absolute; left: 60px; right: 60px; top: 40px; display: flex; justify-content: space-between; opacity: 0; visibility: hidden; transition: opacity .3s; }
#bar.on { opacity: 1; visibility: visible; }
.pill { font: 600 24px "Inter"; padding: 8px 26px 8px 14px; border-radius: 40px; background: rgba(255,255,255,.2); transition: background .2s, color .2s, transform .3s var(--lift); }
.pill.focus { background: rgba(255,255,255,.95); color: #1c1c1e; transform: scale(1.06); }

#overlay > .hold { position: absolute; inset: 0; transition: opacity .32s var(--ease), transform .32s var(--ease); }
#overlay > .hold.out { opacity: 0; transform: scale(.98); }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 28px 30px 26px; border-radius: 40px; box-shadow: 0 30px 70px rgba(0,0,0,.4); }
.card h2 { margin: 0 0 18px; font: 800 32px "Inter"; text-align: center; }
.card p { margin: -8px 0 20px; font: 400 22px/1.3 "Inter"; color: rgba(255,255,255,.8); text-align: center; white-space: pre-line; }
.r { display: flex; align-items: center; gap: 20px; min-height: 76px; padding: 18px 28px; margin-top: 10px; border-radius: 22px; background: rgba(255,255,255,.09); transition: background .2s, transform .22s var(--ease), color .2s; }
.r.two { padding: 14px 28px; }
.r.focus { background: rgba(255,255,255,.95); color: #1c1c1e; transform: scale(1.02); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.r .t { flex: 1; font: 600 28px "Inter"; }
.r .t small { display: block; font: 400 19px "Inter"; opacity: .7; margin-top: 4px; }
.r .v { font: 400 26px "Inter"; opacity: .7; }
.r .ck { width: 30px; height: 30px; color: #0a84ff; }
.r.focus .ck { color: #1c1c1e; }
.r .ic { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.r .ic svg { width: 26px; height: 26px; }
.r .em { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none; }
.r .th { width: 72px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
.r.center { justify-content: center; text-align: center; }
.r.danger .t { color: #ff6961; }
.r.danger.focus .t { color: #1c1c1e; }

#set { position: absolute; inset: 0; background: rgba(0,0,0,.3); }
#side { position: absolute; left: 48px; top: 48px; bottom: 48px; width: 560px; padding: 30px 24px; border-radius: 44px; }
#page { position: absolute; left: 660px; top: 40px; width: 1180px; bottom: 0; padding: 20px 40px 60px 20px; overflow: hidden; }
#page h1 { margin: 10px 0 8px 14px; font: 800 52px "Inter"; }
#page h5 { margin: 26px 0 0 14px; font: 600 20px "Inter"; color: rgba(255,255,255,.5); }
#page .foot { margin: 22px 14px 0; font: 400 19px/1.3 "Inter"; color: rgba(255,255,255,.55); }
#pagein { transition: transform .35s var(--ease); }

.setup { position: absolute; inset: 0; background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.setup::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.64); }
.setup > * { position: relative; }
.setup h1 { margin: 0; font: 800 64px "Inter"; }
.setup .hello { font: 800 150px/190px "Inter"; transition: opacity .4s; }
.setup .line { margin: 14px 300px 0; font: 400 26px/1.3 "Inter"; color: rgba(255,255,255,.8); }
.setup .btn { width: 620px; }
.setup .madeby { margin-top: 90px; font: 400 20px "Inter"; color: rgba(255,255,255,.6); }
.setup .emos { display: flex; gap: 20px; margin: 22px 0 8px; }
.setup .emo { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; transition: transform .26s var(--lift); }
.setup .emo.on { box-shadow: inset 0 0 0 4px #fff; }
.setup .emo.focus { transform: scale(1.22); }
.setup .looks { display: flex; gap: 26px; margin-top: 26px; }
.setup .look { transition: transform .32s var(--lift); }
.setup .look img { width: 256px; height: 144px; border-radius: 24px; object-fit: cover; display: block; }
.setup .look span { display: block; margin-top: 16px; font: 600 20px "Inter"; color: rgba(255,255,255,.8); }
.setup .look.focus { transform: scale(1.12); }
.setup .look.focus img { box-shadow: 0 20px 44px rgba(0,0,0,.5); }
.setup .dots { position: absolute; bottom: 54px; display: flex; gap: 12px; }
.setup .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); }
.setup .dots i.on { background: #fff; width: 10px; height: 10px; }
#nameIn { width: 620px; margin-top: 24px; padding: 16px 24px; border: 0; border-radius: 22px; font: 600 30px "Inter"; color: #1c1c1e; background: rgba(255,255,255,.95); outline: none; text-align: center; }

.pinpad { display: grid; grid-template-columns: repeat(3, 110px); gap: 12px; justify-content: center; }
.pk { height: 72px; border-radius: 22px; display: grid; place-items: center; font: 600 30px "Inter"; background: rgba(255,255,255,.12); transition: transform .2s, background .2s, color .2s; }
.pk.focus { background: rgba(255,255,255,.95); color: #1c1c1e; transform: scale(1.08); }
.dots4 { display: flex; justify-content: center; gap: 18px; margin: 4px 0 20px; }
.dots4 i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
.dots4 i.on { background: #fff; }
.dots4.shake { animation: shake .35s; }
@keyframes shake { 25%, 75% { transform: translateX(-12px); } 50% { transform: translateX(12px); } }
.hint { margin-top: 12px; font: 400 18px "Inter"; color: rgba(255,255,255,.5); text-align: center; }

#toast { position: absolute; left: 50%; bottom: 70px; transform: translate(-50%, 20px); max-width: 1100px; padding: 18px 34px; border-radius: 40px; background: rgba(44,44,48,.9); font: 600 24px "Inter"; text-align: center; opacity: 0; transition: opacity .3s, transform .3s var(--ease); pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#app { position: absolute; inset: 0; background: #000; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .35s; }
#app.on { opacity: 1; }
#app div { text-align: center; font: 600 30px "Inter"; color: rgba(255,255,255,.75); }
#app img { width: 400px; border-radius: 30px; display: block; margin: 0 auto 30px; }
</style>
</head>
<body>
<div id="stage" class="g-liquid">
  <div id="scenes"></div>
  <div id="dim"></div>
  <div id="date"><div class="g"></div><div class="d"></div></div>
  <div id="content">
    <div id="band" class="glass"></div>
    <div id="row1" class="row"></div>
    <div id="grid"></div>
  </div>
  <div id="bar"><div class="pill" id="chip" data-f data-act="profiles"></div><div class="pill" data-f data-act="settings" style="padding-left:26px">Settings</div></div>
  <div id="overlay"></div>
  <div id="app"><div><img alt=""><span></span><br><small style="font-weight:400;font-size:22px;opacity:.6">Demo · on the TV the app opens here · press Back</small></div></div>
  <div id="toast"></div>
</div>
<div id="help"><b>← ↑ → ↓</b> move · <b>Enter</b> select · <b>hold Enter</b> app menu · <b>Esc</b> back · <b>H</b> Home button · <b>M</b> Settings · <b>R</b> run setup again · mouse works too</div>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $("#stage");
function fit() { const k = Math.min(innerWidth / 1940, (innerHeight - 40) / 1100); stage.style.transform = `scale(${k})`; }
addEventListener("resize", fit); fit();

/* ---------- the same data as Scenes.java, Apps.java and Store.java ---------- */
const SCENES = [["ossau", "Ossau", 154, 400], ["flatirons", "Flatirons", 150, 352], ["luna", "Valle de la Luna", 246, 400],
  ["kathleen", "Kathleen Lake", 174, 400], ["titicaca", "Titicaca Sunrise", 246, 400], ["louise", "Lake Louise", 114, 400]]
  .map(([id, name, top, size]) => ({ id, name, top, size }));
const W = (id, k) => `native/wall/${id}${k}`;
const APPS = [["com.google.android.youtube.tv", "YouTube"], ["com.netflix.ninja", "Netflix"], ["com.amazon.amazonvideo.livingroom", "Prime Video"],
  ["com.disney.disneyplus", "Disney+"], ["com.apple.atve.androidtv.appletv", "Apple TV"], ["com.spotify.tv.android", "Spotify"], ["com.wbd.stream", "Max"],
  ["com.cbs.ca", "Paramount+"], ["com.crunchyroll.webapp", "Crunchyroll"], ["tv.twitch.android.app", "Twitch"], ["dazn", "DAZN"]].map(([pkg, name]) => ({ pkg, name }));
const app = (p) => APPS.find((a) => a.pkg === p);
const KIDS = [["com.google.android.youtube.tv", "YouTube Kids"], ["com.netflix.ninja", "Netflix"], ["com.disney.disneyplus", "Disney+"], ["com.amazon.amazonvideo.livingroom", "Prime Video"]];
const EMOJIS = ["🦊", "🐼", "🐯", "🦁", "🐸", "🐨", "🐙", "🦄", "🐶", "🐱"], EMO_BG = ["#ff9f0a", "#d1d1d6", "#ff9500", "#ffcc00", "#34c759", "#8e8e93", "#ff2d55", "#bf5af2", "#a2845e", "#ffd60a"];
const CITIES = ["New Delhi", "Mumbai", "London", "New York", "Tokyo", "Sydney"];
const S = { profiles: [{ name: "Advik", emoji: "🦊", bg: "#ff9f0a", top: [], hidden: [] }, { name: "Kids", emoji: "🐯", bg: "#ff9500", kids: true, top: [], hidden: [] }],
  current: 0, scene: 0, dock: 5, rotate: true, sounds: true, motion: false, glass: "liquid", weather: "auto", city: 0, pin: "1234" };
const me = () => S.profiles[S.current];

/* ---------- sounds: the same pre-rendered WAVs SoundPool plays ---------- */
const SFX = {}; ["nav", "ok", "back", "edge"].forEach((n) => SFX[n] = new Audio(`native/sfx/${n}.wav`));
let lastNav = 0;
function snd(n) {
  if (!S.sounds) return;
  if (n === "nav") { const t = performance.now(); if (t - lastNav < 45) return; lastNav = t; }
  const a = SFX[n].cloneNode(); a.volume = 1; if (n === "nav") a.playbackRate = 1 + (Math.random() - .5) * .016; a.play().catch(() => {});
}

/* ---------- icons: Icons.java's shapes as SVG ---------- */
const SVG = (inner, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const IC = {
  home: '<rect x="4" y="4" width="7" height="7" rx="2" fill="#fff" stroke="none"/><rect x="13" y="4" width="7" height="7" rx="2" fill="#fff" stroke="none"/><rect x="4" y="13" width="7" height="7" rx="2" fill="#fff" stroke="none"/><rect x="13" y="13" width="7" height="7" rx="2" fill="#fff" stroke="none"/>',
  appearance: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="#fff"/>',
  wallpaper: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M5 17l5-6 3.5 4 2-2 3.5 4"/><circle cx="16" cy="9" r="1.6" fill="#fff" stroke="none"/>',
  weather: '<path d="M7 18h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z" fill="#fff" stroke="none"/>',
  display: '<rect x="3" y="5" width="18" height="11" rx="2"/><path d="M8 20h8"/>',
  googletv: '<rect x="3.5" y="5" width="17" height="11.5" rx="2.2"/><path d="M8.5 20h7M10 8.5L8 11l2 2.5M8 11h6"/>',
  updates: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  about: '<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="1.2" fill="#fff" stroke="none"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L20 20"/>',
  inputs: '<rect x="3" y="5" width="18" height="11" rx="2"/><path d="M8 20h8M9 10.5h6M12.5 8l2.5 2.5-2.5 2.5"/>',
  lock: '<rect x="5" y="10" width="14" height="11" rx="1.5" fill="#fff" stroke="none"/><path d="M7.5 10.5V9a4.5 4.5 0 0 1 9 0v1.5"/>',
};
function gearSVG() {
  let d = ""; const n = 36, r = 45, ri = 40.5;
  for (let i = 0; i < n; i++) {
    const a0 = 2 * Math.PI * i / n, pt = (a, rr) => `${(50 + Math.cos(a) * rr).toFixed(2)},${(50 + Math.sin(a) * rr).toFixed(2)}`;
    d += (i ? "L" : "M") + pt(a0, r) + "L" + pt(a0 + Math.PI / n * .6, r) + "L" + pt(a0 + Math.PI / n, ri) + "L" + pt(a0 + Math.PI / n * 1.6, ri);
  }
  const sp = (a) => { const t = a * Math.PI / 180; return `M50,50L${(50 + 25 * Math.cos(t)).toFixed(1)},${(50 + 25 * Math.sin(t)).toFixed(1)}`; };
  return `<svg viewBox="0 0 100 100" style="width:62%;height:62%"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70747c"/><stop offset="1" stop-color="#33363c"/></linearGradient>
    <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ebee"/><stop offset="1" stop-color="#b9bdc4"/></linearGradient></defs>
    <path d="${d}Z" fill="url(#gd)"/><circle cx="50" cy="50" r="33.5" fill="url(#gf)"/><circle cx="50" cy="50" r="26" fill="none" stroke="#4a4e56" stroke-width="4.2"/>
    <path d="${sp(-90)}${sp(30)}${sp(150)}" stroke="#4a4e56" stroke-width="5.2" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="#4a4e56"/></svg>`;
}
const CHECK = SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.6), CHEV = SVG('<path d="M9 5l7 7-7 7"/>', 2.4);

/* ---------- the wallpaper and the glass clock (SceneView.java) ---------- */
let scene = 0, sceneTimer;
$("#scenes").innerHTML = SCENES.map((s) => `<div class="scene" data-id="${s.id}"><img src="${W(s.id, ".jpg")}" alt="">
  <div class="gclock" style="top:${s.top}px;font-size:${s.size}px;height:${s.size}px"><span class="fill" style="background-image:url(${W(s.id, "-glass.jpg")});background-position:0 -${s.top}px"></span><span class="rim"></span></div>
  <img src="${W(s.id, "-fg.webp")}" alt=""></div>`).join("");
function showScene(i, animate = true) {
  scene = (i + SCENES.length) % SCENES.length; S.scene = scene;
  $$(".scene").forEach((e, k) => { e.style.transitionDuration = animate && !S.motion ? "2.4s" : "0s"; e.classList.toggle("on", k === scene); });
  placeDate();
  setTimeout(glassAll, animate ? 1200 : 0);   // the glass takes the new wallpaper's blurred copy mid-fade
}
function placeDate() {
  const s = SCENES[scene], d = $("#date");
  d.style.top = Math.max(s.top - 24 - d.offsetHeight, 64) + "px";
}
function tick() {
  const n = new Date(), h = n.getHours(), t = `${h % 12 || 12}:${String(n.getMinutes()).padStart(2, "0")}`;
  $$(".gclock span").forEach((e) => e.textContent = t);
  const hello = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
  $("#date .g").textContent = `${hello}, ${me().name}`;
  const wx = S.weather === "off" ? "" : "   ☁︎ 24° Cloudy";
  $("#date .d").textContent = n.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }).replace(",", "") + wx;
}

/* ---------- Liquid Glass (Glass.java): the matching slice of the pre-blurred wallpaper ---------- */
function glassAll() {
  const sb = stage.getBoundingClientRect(), k = sb.width / 1920, g = `url(${W(SCENES[scene].id, "-glass.jpg")})`;
  $$(".glass").forEach((e) => {
    const r = e.getBoundingClientRect();
    e.style.backgroundImage = g;
    e.style.backgroundPosition = `${-(r.left - sb.left) / k}px ${-(r.top - sb.top) / k}px`;
  });
}
function glassFollow(ms) { const end = performance.now() + ms; (function f() { glassAll(); if (performance.now() < end) setTimeout(f, 16); })(); }

/* ---------- Home (MainActivity.buildHome) ---------- */
let deep = false, ambient = false;
function topRow(p) {
  const out = [];
  for (const k of p.top) { const a = app(k); if (a && !p.hidden.includes(k) && out.length < S.dock) out.push(a); }
  for (const a of APPS) { if (out.length >= S.dock) break; if (!out.includes(a) && !p.hidden.includes(a.pkg) && !p.top.includes("-" + a.pkg)) out.push(a); }
  return out;
}
function tileHTML(a, sys, label, kids) {
  const face = a ? `<img src="native/art/${a.pkg}.jpg" alt="">` : sys === "settings"
    ? `<div class="sysface" style="background:linear-gradient(#e4e6ea,#a9adb5)">${gearSVG()}</div>`
    : `<div class="sysface" style="background:${sys === "parents" ? "linear-gradient(#ffd36a,#f0a020)" : "linear-gradient(#9aa0ab,#5f6571)"};color:#fff">${SVG(IC[sys === "parents" ? "lock" : sys])}</div>`;
  return `<div class="tile" data-f ${a ? `data-app="${a.pkg}"` : `data-sys="${sys}"`}><div class="face" style="width:var(--tw);height:var(--th)">${face}<div class="gloss"></div>${kids ? '<span class="kb">Kids</span>' : ""}</div><div class="name" style="top:calc(var(--th) + 22px)">${label}</div></div>`;
}
function buildHome() {
  const p = me(), kids = !!p.kids, cols = S.dock + 1, gap = 36, tw = (1792 - gap * (cols - 1)) / cols, th = tw * .6;
  const bandH = th + 52, bandTop = 1080 - 64 - bandH, gridTop = bandTop + bandH + 58;

    let h = "";
    if (n === 0) h = `<div class="hello">${HELLOS[0]}</div><div class="line">Welcome to PureTV for your TV.</div><div style="margin-top:24px">${btn("next", "Get Started", "Set up your Home screen")}</div><div class="madeby">Made with ❤️ by Crazified Studios</div>`;
    if (n === 1) h = `<h1>Create Your Profile</h1><div class="line">Your name and avatar appear on the Home screen and in Settings.</div><div style="margin-top:24px">${btn("name", "Name", null, { v: p.name, go: 1, center: 0 })}</div>
      <div class="emos">${EMOJIS.map((e, i) => `<div class="emo${p.emoji === e ? " on" : ""}" data-f data-emo="${i}" style="background:${EMO_BG[i]}">${e}</div>`).join("")}</div><div style="margin-top:14px">${btn("next", "Continue")}</div>`;
    if (n === 2) h = `<h1>Look and Style</h1><div class="line">Choose the glass for menus, panels and Settings.</div><div style="margin-top:12px">`
      + [["liquid", "Liquid Glass", "Clear glass that shows the wallpaper through"], ["frosted", "Frosted Glass", "Softer, brighter panels"], ["dark", "Dark", "Deep, dark panels for a dark room"]].map(([id, t, s]) => btn("g" + id, t, s, { check: S.glass === id })).join("") + `<div style="margin-top:12px">${btn("next", "Continue")}</div></div>`;
    if (n === 3) h = `<h1>Choose a Wallpaper</h1><div class="line">Your clock sits behind the scenery. Wallpapers change every 20 seconds.</div><div class="looks">${SCENES.map((s, i) => `<div class="look" data-f data-look="${i}"><img src="${W(s.id, "-t.jpg")}" alt=""><span>${s.name}</span></div>`).join("")}</div>`;
    if (n === 4) h = `<h1>Home Button</h1><div class="line">PureTV is this TV's Home screen. Google TV's home is switched off (not deleted), so the TV runs one Home screen and stays fast.</div><div style="margin-top:26px">${btn("next", "Continue")}</div>`;
    if (n === 5) h = `<div style="font:800 64px Inter;color:#30d158">✓</div><h1>You're All Set</h1><div class="line">Change any of this in Settings, or run setup again from there.</div><div style="margin-top:24px">${btn("done", "Go to Home Screen")}</div><div class="madeby">Made with ❤️ by Crazified Studios</div>`;
    setupEl.style.backgroundImage = `url(${W(SCENES[scene].id, "-glass.jpg")})`;
    setupEl.innerHTML = h + dots;
    setupEl.go = go; setupEl.step = () => step;
    cur = null;
    focus(n === 3 ? $$(".look", setupEl)[scene] : n === 2 ? $(`[data-k="g${S.glass}"]`, setupEl) : $("[data-f]", setupEl), true);
    if (n === 0) helloT = setInterval(() => { const e = $(".hello", setupEl); if (!e) return; e.style.opacity = 0; setTimeout(() => { hi = (hi + 1) % HELLOS.length; e.textContent = HELLOS[hi]; e.style.opacity = 1; }, 400); }, 2600);
  };
  go(0);
}
function setupSelect(e) {
  const n = setupEl.step();
  if (e.dataset.emo) { const i = +e.dataset.emo; me().emoji = EMOJIS[i]; me().bg = EMO_BG[i]; buildHome(); return setupEl.go(1); }
  if (e.dataset.look) { showScene(+e.dataset.look, false); return setupEl.go(4); }
  const k = e.dataset.k;
  if (k === "name") return editName(() => setupEl.go(1));
  if (k && k.startsWith("g")) { S.glass = k.slice(1); stage.className = "g-" + S.glass; return setupEl.go(2); }
  if (k === "done") { clearInterval(helloT); close(setupEl.parentNode); setupEl = null; try { localStorage.setItem("puretv.native.setup", "1"); } catch (x) { } return; }
  if (k === "next") return setupEl.go(n + 1);
}

/* ---------- select, back, keys ---------- */
function select() {
  const e = cur; if (!e) return;
  snd("ok");
  if (setupEl && e.closest(".setup")) return setupSelect(e);
  if (e.dataset.pin) return e.closest(".card").pin(e.dataset.pin);
  if (setRoot && e.closest("#set")) {
    if (e.dataset.side) { const f = $("#pagein .r", setRoot); return f && focus(f); }
    const a = setRoot.pageActs[e.dataset.k]; return a && a();
  }
  const c = e.closest(".card"); if (c && c.actions && c.actions[e.dataset.k]) return c.actions[e.dataset.k]();
  if (topL().home) return selectHome(e);
}
function back() {
  snd("back");
  if (appOpen) { $("#app").classList.remove("on"); appOpen = false; return; }
  if (ambient) return setAmbient(false);
  const t = topL();
  if (!t.home) { if (t.back) return t.back(); return close(t.root); }
  if (deep || (cur && cur.closest("#bar"))) focus($("#row1 .tile"));
}
function homeButton() {
  if (appOpen) { $("#app").classList.remove("on"); appOpen = false; }
  if (setupEl) return;
  closeAll(); setAmbient(false); setDeep(false); focus($("#row1 .tile"));
}
let idleT, okT = null, okLong = false;
function wake() { clearTimeout(idleT); idleT = setTimeout(() => { if (topL().home && !appOpen) setAmbient(true); }, 25000); }
addEventListener("keydown", (e) => {
  if (e.target.id === "nameIn") return;
  const k = e.key; wake();
  if (ambient) { e.preventDefault(); return setAmbient(false); }
  if (k.startsWith("Arrow")) { e.preventDefault(); if (appOpen) return; if (e.repeat && performance.now() - (move.t || 0) < 110) return; move.t = performance.now();
    return move(k === "ArrowLeft" ? -1 : k === "ArrowRight" ? 1 : 0, k === "ArrowUp" ? -1 : k === "ArrowDown" ? 1 : 0); }
  if (k === "Enter" || k === " ") { e.preventDefault(); if (e.repeat || appOpen) return; okLong = false; clearTimeout(okT);
    okT = setTimeout(() => { okLong = true; okT = null; if (cur && cur.dataset.app && topL().home) appMenu(cur); else select(); }, 520); return; }
  if (k === "Escape" || k === "Backspace") { e.preventDefault(); return back(); }
  if (k === "h" || k === "H") return homeButton();
  if (k === "m" || k === "M") { if (topL().home && !me().kids) settings(); return; }
  if (k === "r" || k === "R") { closeAll(); runSetup(); }
});
addEventListener("keyup", (e) => { if ((e.key === "Enter" || e.key === " ") && okT) { clearTimeout(okT); okT = null; if (!okLong) select(); } });
stage.addEventListener("mousemove", (e) => { const t = e.target.closest("[data-f]"); if (t && items().includes(t) && t !== cur) focus(t); wake(); });
stage.addEventListener("click", (e) => { wake(); if (ambient) return setAmbient(false); if (appOpen) return back(); const t = e.target.closest("[data-f]"); if (t && items().includes(t)) { focus(t, true); select(); } });
stage.addEventListener("contextmenu", (e) => { e.preventDefault(); const t = e.target.closest("[data-app]"); if (t && topL().home) { focus(t, true); appMenu(t); } });

/* ---------- start ---------- */
buildHome(); showScene(0, false); tick();
setInterval(tick, 5000);
setInterval(() => { if (S.rotate && topL().home && !appOpen) showScene(scene + 1); }, 20000);
document.fonts.ready.then(() => { placeDate(); glassAll(); });
let seen = false; try { seen = localStorage.getItem("puretv.native.setup") === "1"; } catch (x) { }
if (!seen || location.search.includes("setup")) runSetup(); else focus($("#row1 .tile"), true);
wake();
</script>
</body>
</html>
